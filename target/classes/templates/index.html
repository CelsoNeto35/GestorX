<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GestorX - Painel</title>
        <link rel="icon" th:href="@{/assets/icons/favicon.ico}" />

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <!-- Google Charts -->
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

        <style>
            body {
                display: flex;
                min-height: 100vh;
                margin: 0;
                background-color: #f5f6fa;
                font-family: 'Segoe UI', sans-serif;
            }

            /* ===== SIDEBAR ===== */
            .sidebar {
                width: 250px;
                background: linear-gradient(180deg, #000 0%, #0a0a0a 100%);
                color: #fff;
                position: fixed;
                height: 100vh;
                padding-top: 20px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                box-shadow: 3px 0 10px rgba(0, 0, 0, 0.3);
                z-index: 1000;
                transition: transform 0.3s ease;
            }

            .sidebar .navbar-brand {
                font-size: 1.6rem;
                font-weight: 700;
                text-align: center;
                color: #fff;
                margin-bottom: 20px;
                letter-spacing: 1px;
            }

            .sidebar .nav-link {
                color: #ccc;
                font-weight: 500;
                border-radius: 10px;
                padding: 10px 15px;
                margin: 5px 0;
                transition: all 0.2s ease;
            }

            .sidebar .nav-link:hover,
            .sidebar .nav-link.active {
                background-color: #fff;
                color: #000;
            }

            .logout-btn {
                background-color: transparent;
                color: #fff;
                border: 1px solid #fc0808;
                transition: 0.3s;
            }

            .logout-btn:hover {
                background-color: #fc0808;
                color: #fff;
            }

            /* ===== MAIN CONTENT ===== */
            .content {
                margin-left: 280px;
                padding: 40px;
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .card {
                border: none;
                border-radius: 15px;
            }

            .card-header {
                border-radius: 15px 15px 0 0 !important;
                font-weight: 600;
            }

            .card.shadow {
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            }

            h3.dashboard-title {
                font-weight: 600;
                color: #333;
                margin-bottom: 30px;
            }

            /* Espaçamento e estilo dos gráficos */
            .chart-wrapper {
                background: #fff;
                border-radius: 15px;
                padding: 25px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
                margin-bottom: 25px;
            }

            .chart-wrapper h5 {
                margin-bottom: 20px;
                color: #333;
                font-weight: 600;
            }

            footer {
                text-align: center;
                color: #888;
                margin-top: 30px;
                font-size: 0.9rem;
            }

            /* Loading spinner */
            .spinner-border {
                width: 3rem;
                height: 3rem;
                border-width: 0.3em;
            }

            /* ===== RESPONSIVIDADE ===== */
            
            /* Botão mobile (escondido por padrão) */
            .mobile-menu-btn {
                display: none;
            }

            .sidebar-overlay {
                display: none;
            }

            /* Tablets e dispositivos médios */
            @media (max-width: 992px) {
                .sidebar {
                    transform: translateX(-250px);
                }

                .sidebar.active {
                    transform: translateX(0);
                }

                .content {
                    margin-left: 0;
                    padding: 20px;
                }

                .mobile-menu-btn {
                    display: block;
                    position: fixed;
                    top: 15px;
                    left: 15px;
                    z-index: 999;
                    background: #000;
                    color: #fff;
                    border: none;
                    padding: 10px 15px;
                    border-radius: 8px;
                    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
                    font-size: 1.2rem;
                }

                .sidebar-overlay {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.5);
                    z-index: 999;
                }

                .sidebar-overlay.active {
                    display: block;
                }

                h3.dashboard-title {
                    margin-top: 50px;
                }

                .chart-wrapper {
                    padding: 20px;
                }

                #column_chart,
                #pie_chart,
                #donut_chart {
                    height: 350px !important;
                }
            }

            /* Smartphones */
            @media (max-width: 576px) {
                .content {
                    padding: 15px;
                }

                h3.dashboard-title {
                    font-size: 1.5rem;
                }

                .chart-wrapper {
                    padding: 15px;
                }

                .chart-wrapper h5 {
                    font-size: 1rem;
                }

                #column_chart,
                #pie_chart,
                #donut_chart {
                    height: 300px !important;
                }
            }
        </style>
    </head>

    <body>
        <!-- Botão Menu Mobile -->
        <button class="mobile-menu-btn" onclick="toggleSidebar()">
            ☰
        </button>

        <!-- Overlay para fechar menu no mobile -->
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

        <nav class="sidebar" id="sidebar">
            <div>
                <a class="navbar-brand" href="/index">GestorX</a>
                <ul class="nav flex-column px-3">
                    <li class="nav-item"><a class="nav-link active" href="/index">Painel</a></li>
                    <li class="nav-item"><a class="nav-link" href="/listarFaturamento">Faturamento</a></li>
                    <li class="nav-item"><a class="nav-link" href="/listarComissao">Comissão</a></li>
                    <li class="nav-item"><a class="nav-link" href="/vendaCadastradas">Vendas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/produtoCadastrados">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/estoqueCadastrados">Estoque</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clienteCadastrados">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/fornecedorCadastrados">Fornecedores</a></li>
                    <li class="nav-item"><a class="nav-link" href="/usuarioCadastrados">Usuários</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="dropdownRelatorios" 
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Relatórios
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="dropdownRelatorios">
                            <li>
                                <a class="dropdown-item" href="/relatorio/vendas/pdf" target="_blank">
                                    Relatório de Vendas
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>

            <form th:action="@{/logout}" method="post" class="px-3 mb-3">
                <button class="btn logout-btn w-100" type="submit">Sair</button>
            </form>
        </nav>

        <div class="content">
            <h3 class="dashboard-title">Dashboard</h3>

            <div class="row g-4">
                <!-- Gráfico Coluna -->
                <div class="col-12">
                    <div class="chart-wrapper">
                        <h5 class="mb-2 text-dark fw-bold">Vendas Mensais</h5>
                        <div id="column_chart" style="width: 100%; height: 400px;"></div>
                    </div>
                </div>

                <!-- Gráfico Pizza -->
                <div class="col-12 col-md-6">
                    <div class="chart-wrapper">
                        <h5 class="mb-2 text-dark fw-bold">Raças</h5>
                        <div id="pie_chart" style="width: 100%; height: 400px;"></div>
                    </div>
                </div>

                <!-- Gráfico Donut -->
                <div class="col-12 col-md-6">
                    <div class="chart-wrapper">
                        <h5 class="mb-2 text-dark fw-bold">Produtos</h5>
                        <div id="donut_chart" style="width: 100%; height: 400px;"></div>
                    </div>
                </div>
            </div>

            <footer>
                © 2025 GestorX - Todos os direitos reservados
            </footer>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        
        <script>
            // Toggle do menu mobile
            function toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.querySelector('.sidebar-overlay');
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }

            // Fechar menu ao clicar em um link (mobile)
            if (window.innerWidth <= 992) {
                document.querySelectorAll('.sidebar .nav-link').forEach(link => {
                    link.addEventListener('click', () => {
                        if (!link.classList.contains('dropdown-toggle')) {
                            toggleSidebar();
                        }
                    });
                });
            }
        </script>

        <script th:inline="none">
            google.charts.load('current', {'packages': ['corechart']});
            google.charts.setOnLoadCallback(drawCharts);

            let charts = {};

            async function drawCharts() {
                try {
                    document.getElementById('column_chart').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Carregando dados...</p></div>';
                    document.getElementById('pie_chart').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div></div>';
                    document.getElementById('donut_chart').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div></div>';
                    
                    const [vendasResponse, racasResponse, produtosResponse] = await Promise.all([
                        fetch('/index/api/vendas-mensais'),
                        fetch('/index/api/racas'),
                        fetch('/index/api/produtos')
                    ]);
                    
                    if (!vendasResponse.ok || !racasResponse.ok || !produtosResponse.ok) {
                        throw new Error('Erro ao buscar dados do servidor');
                    }

                    const vendas = await vendasResponse.json();
                    const racas = await racasResponse.json();
                    const produtos = await produtosResponse.json();
                    
                    // ===== GRÁFICO DE VENDAS (Coluna) =====
                    const columnDataArray = [["Mês", "Vendas", {role: "style"}]];
                    
                    if (Object.keys(vendas).length === 0) {
                        columnDataArray.push(["Sem dados", 0, "color: #cccccc"]);
                    } else {
                        Object.entries(vendas).forEach(([mes, valor], index) => {
                            columnDataArray.push([
                                mes, 
                                valor, 
                                index % 2 === 0 ? "color: #000000" : "color: #1E88E5"
                            ]);
                        });
                    }
                    
                    const columnData = google.visualization.arrayToDataTable(columnDataArray);

                    const getColumnOptions = () => {
                        const isMobile = window.innerWidth <= 576;
                        const isTablet = window.innerWidth <= 992;
                        
                        return {
                            title: isMobile ? "" : "Vendas por Mês",
                            legend: {position: "none"},
                            backgroundColor: "transparent",
                            hAxis: {
                                title: isMobile ? "" : "Mês",
                                titleTextStyle: {color: '#333'},
                                slantedText: isMobile,
                                slantedTextAngle: isMobile ? 45 : 0,
                                textStyle: {
                                    fontSize: isMobile ? 10 : 12
                                }
                            },
                            vAxis: {
                                title: isMobile ? "" : "Quantidade",
                                minValue: 0,
                                format: '0',
                                textStyle: {
                                    fontSize: isMobile ? 10 : 12
                                }
                            },
                            chartArea: {
                                width: isMobile ? '75%' : isTablet ? '80%' : '85%', 
                                height: isMobile ? '65%' : '70%',
                                left: isMobile ? 40 : 60,
                                top: isMobile ? 20 : 40
                            },
                            bar: {
                                groupWidth: isMobile ? '70%' : '75%'
                            }
                        };
                    };

                    // ===== GRÁFICO DE RAÇAS (Pizza) =====
                    const pieDataArray = [["Categoria", "Quantidade"]];
                    
                    if (Object.keys(racas).length === 0) {
                        pieDataArray.push(["Sem dados", 1]);
                    } else {
                        Object.entries(racas).forEach(([categoria, quantidade]) => {
                            pieDataArray.push([categoria, quantidade]);
                        });
                    }
                    
                    const pieData = google.visualization.arrayToDataTable(pieDataArray);

                    const getPieOptions = () => {
                        const isMobile = window.innerWidth <= 576;
                        
                        return {
                            pieSliceText: "value",
                            legend: {
                                position: isMobile ? "bottom" : "right",
                                textStyle: {
                                    fontSize: isMobile ? 10 : 12
                                }
                            },
                            backgroundColor: "transparent",
                            colors: ["#000000", "#1E88E5", "#43A047", "#FB8C00", "#E53935"],
                            chartArea: {
                                width: isMobile ? '90%' : '90%', 
                                height: isMobile ? '65%' : '80%'
                            }
                        };
                    };

                    // ===== GRÁFICO DE PRODUTOS (Donut) =====
                    const donutDataArray = [["Categoria", "Quantidade"]];
                    
                    if (Object.keys(produtos).length === 0) {
                        donutDataArray.push(["Sem dados", 1]);
                    } else {
                        Object.entries(produtos).forEach(([categoria, quantidade]) => {
                            donutDataArray.push([categoria, quantidade]);
                        });
                    }
                    
                    const donutData = google.visualization.arrayToDataTable(donutDataArray);

                    const getDonutOptions = () => {
                        const isMobile = window.innerWidth <= 576;
                        
                        return {
                            pieHole: 0.5,
                            legend: {
                                position: isMobile ? "bottom" : "right",
                                textStyle: {
                                    fontSize: isMobile ? 10 : 12
                                }
                            },
                            backgroundColor: "transparent",
                            colors: ["#000000", "#1E88E5", "#43A047", "#FB8C00", "#E53935"],
                            chartArea: {
                                width: isMobile ? '90%' : '90%', 
                                height: isMobile ? '65%' : '80%'
                            },
                            pieSliceText: "value"
                        };
                    };

                    // Renderizar todos os gráficos
                    charts.columnChart = new google.visualization.ColumnChart(document.getElementById('column_chart'));
                    charts.pieChart = new google.visualization.PieChart(document.getElementById('pie_chart'));
                    charts.donutChart = new google.visualization.PieChart(document.getElementById('donut_chart'));
                    
                    charts.columnChart.draw(columnData, getColumnOptions());
                    charts.pieChart.draw(pieData, getPieOptions());
                    charts.donutChart.draw(donutData, getDonutOptions());

                    // Armazenar dados para redimensionamento
                    charts.columnData = columnData;
                    charts.pieData = pieData;
                    charts.donutData = donutData;
                    charts.getColumnOptions = getColumnOptions;
                    charts.getPieOptions = getPieOptions;
                    charts.getDonutOptions = getDonutOptions;

                    console.log('Gráficos carregados com sucesso!');
                    console.log('Vendas:', vendas);
                    console.log('Raças:', racas);
                    console.log('Produtos:', produtos);

                } catch (error) {
                    console.error('Erro ao carregar dados dos gráficos:', error);
                    
                    const errorMessage = `
                        <div class="alert alert-danger m-3" role="alert">
                            <strong>Erro ao carregar dados!</strong><br>
                            Por favor, recarregue a página ou entre em contato com o suporte.
                        </div>
                    `;
                    
                    document.getElementById('column_chart').innerHTML = errorMessage;
                    document.getElementById('pie_chart').innerHTML = errorMessage;
                    document.getElementById('donut_chart').innerHTML = errorMessage;
                }
            }

            // Redesenhar gráficos quando a janela for redimensionada
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (charts.columnChart && charts.columnData) {
                        charts.columnChart.draw(charts.columnData, charts.getColumnOptions());
                        charts.pieChart.draw(charts.pieData, charts.getPieOptions());
                        charts.donutChart.draw(charts.donutData, charts.getDonutOptions());
                    }
                }, 250);
            });
        </script>

        <script th:if="${loginSucesso}">
            document.addEventListener("DOMContentLoaded", function () {
                Swal.fire({
                    title: 'Bem-vindo ao GestorX!',
                    text: 'Login realizado com sucesso.',
                    icon: 'success',
                    showConfirmButton: false,
                    timer: 2200,
                    timerProgressBar: true,
                    position: 'center'
                });
            });
        </script>
    </body>
</html>
