<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Usuários - GestorX</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

        <style>
            body {
                display: flex;
                min-height: 100vh;
                margin: 0;
                background-color: #f5f6fa;
                font-family: 'Segoe UI', sans-serif;
            }

            /* ===== SIDEBAR ===== */
            .sidebar {
                width: 250px;
                background: linear-gradient(180deg, #000 0%, #0a0a0a 100%);
                color: #fff;
                position: fixed;
                height: 100vh;
                padding-top: 20px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                box-shadow: 3px 0 10px rgba(0,0,0,0.3);
            }

            .sidebar .navbar-brand {
                font-size: 1.6rem;
                font-weight: 700;
                text-align: center;
                color: #fff;
                margin-bottom: 20px;
                letter-spacing: 1px;
            }

            .sidebar .nav-link {
                color: #ccc;
                font-weight: 500;
                border-radius: 10px;
                padding: 10px 15px;
                margin: 5px 0;
                transition: all 0.2s ease;
            }

            .sidebar .nav-link:hover,
            .sidebar .nav-link.active {
                background-color: #fff;
                color: #000;
            }

            .logout-btn {
                background-color: transparent;
                color: #fff;
                border: 1px solid #fc0808;
                transition: 0.3s;
            }

            .logout-btn:hover {
                background-color: #fc0808;
                color: #fff;
            }

            /* ===== MAIN CONTENT ===== */
            .content {
                margin-left: 250px;
                padding: 40px;
                width: 100%;
            }

            .card {
                border: none;
                border-radius: 15px;
            }

            .card-header {
                border-radius: 15px 15px 0 0 !important;
                font-weight: 600;
            }

            .card.shadow {
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

            h3.dashboard-title {
                font-weight: 600;
                color: #333;
                margin-bottom: 30px;
            }

            /* ===== Responsividade ===== */
            @media (max-width: 992px) {
                .sidebar {
                    width: 100%;
                    height: auto;
                    position: relative;
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                    justify-content: space-between;
                    padding: 10px 20px;
                }

                .sidebar ul {
                    display: flex;
                    flex-wrap: wrap;
                    justify-content: center;
                    margin-bottom: 0;
                }

                .sidebar .nav-item {
                    margin: 5px;
                }

                .content {
                    margin-left: 0;
                    width: 100%;
                    padding: 20px;
                }
            }

            @media (max-width: 576px) {
                .sidebar {
                    flex-direction: column;
                    align-items: center;
                    text-align: center;
                }

                .sidebar ul {
                    flex-direction: column;
                    padding: 0;
                }

                .sidebar .nav-item {
                    width: 100%;
                }

                table thead {
                    display: none;
                }

                table, table tbody, table tr, table td {
                    display: block;
                    width: 100%;
                }

                table tr {
                    margin-bottom: 15px;
                    border: 1px solid #ddd;
                    border-radius: 10px;
                    padding: 10px;
                    background-color: #fff;
                }

                table td {
                    text-align: right;
                    padding-left: 50%;
                    position: relative;
                    font-size: 0.9rem;
                }

                table td::before {
                    content: attr(data-label);
                    position: absolute;
                    left: 10px;
                    width: 45%;
                    padding-right: 10px;
                    text-align: left;
                    font-weight: bold;
                    color: #000;
                }

                .btn-sm {
                    display: inline-block;
                    margin-top: 5px;
                }
            }
        </style>
    </head>

    <body>
        <!-- ===== SIDEBAR ===== -->
        <nav class="sidebar">
            <div>
                <a class="navbar-brand" href="/index">GestorX</a>
                <ul class="nav flex-column px-3">
                    <li class="nav-item"><a class="nav-link" href="/index">Painel</a></li>
                    <li class="nav-item"><a class="nav-link" href="/listarFaturamento">Faturamento</a></li>
                    <li class="nav-item"><a class="nav-link" href="/listarComissao">Comissão</a></li>
                    <li class="nav-item"><a class="nav-link" href="/vendaCadastradas">Vendas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/produtoCadastrados">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/estoqueCadastrados">Estoque</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clienteCadastrados">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/fornecedorCadastrados">Fornecedores</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/usuarioCadastrados">Usuários</a></li>
                </ul>
            </div>
            <div class="px-3 mb-3">
                <form th:action="@{/logout}" th:method="post">
                    <button class="btn logout-btn w-100" type="submit">Sair</button>
                </form>
            </div>
        </nav>

        <!-- ===== MAIN CONTENT ===== -->
        <div class="content">
            <div class="container">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h5 class="mb-0 fw-bold text-dark">Usuários</h5>
                    </div>
                    <div class="card-body">
                        <a th:href="@{/cadastrarUsuario}" class="btn btn-primary mb-3">
                            <i class="bi bi-plus-circle"></i> Cadastrar Usuário
                        </a>

                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle text-center">
                                <thead class="table-dark">
                                    <tr>
                                        <th>#</th>
                                        <th>Nome</th>
                                        <th>Login</th>
                                        <th>Email</th>
                                        <th colspan="2" style="white-space: nowrap;">Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${usuarios != null and usuarios.isEmpty()}">
                                        <td colspan="6" class="text-center text-muted">
                                            Nenhum usuário cadastrado ainda.
                                        </td>
                                    </tr>
                                    <tr th:each="usuario : ${usuarios}">
                                        <td th:text="${usuario.id}" data-label="ID"></td>
                                        <td th:text="${usuario.nome}" data-label="Nome"></td>
                                        <td th:text="${usuario.email}" data-label="Email"></td>
                                        <td>
                                            <a th:href="@{'/editarUsuario/' + ${usuario.id}}" class="btn btn-warning btn-sm">
                                                <i class="bi bi-pencil-square"></i> Editar
                                            </a>
                                        </td>
                                        <td>
                                            <a href="#"
                                               accesskey=""class="btn btn-danger btn-sm excluir"
                                               th:data-usuario-id="${usuario.id}">
                                                <i class="bi bi-trash"></i> Excluir
                                            </a>

                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="/js/excluirUsuario.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
