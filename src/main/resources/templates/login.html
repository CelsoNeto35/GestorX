<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <title>Login - GestorX</title>

    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" 
          crossorigin="anonymous">

    <!-- CSS local (correto para Spring Boot) -->
    <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css"/>

</head>
<body>

<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow-2-strong" style="border-radius: 1rem;">
          <div class="card-body p-5 text-center">

            <!-- Logo -->
            <img th:src="@{/assets/logosolucao.png}" alt="Logo Solução Network" width="250px" class="mb-4">

            <h3 class="mb-5">GestorX</h3>

            <!-- Formulário de Login com Thymeleaf -->
            <form th:action="@{/login}" th:method="post" th:object="${loginDto}">

              <!-- Campo e-mail -->
              <div class="col-12">
                <div class="form-floating mb-4">
                  <input type="email" id="email" th:field="*{email}" class="form-control form-control-lg" required />
                  <label for="email">E-mail</label>
                </div>
              </div>

              <!-- Campo senha -->
              <div class="col-12">
                <div class="form-floating mb-4">
                  <input type="password" id="senha" th:field="*{senha}" class="form-control form-control-lg" required />
                  <label for="senha">Senha</label>
                </div>
              </div>

              <!-- Botão de confirmar -->
              <div class="pt-1 mb-4">
                <button class="btn btn-success btn-lg w-100" type="submit">Login</button>
              </div>

            </form>

            <!-- Mensagens de status -->
            <div th:if="${param.sucesso}" class="alert alert-info mt-3" role="alert">
              <span class="mensagem">Login realizado com sucesso!</span>
            </div>

            <div th:if="${param.erro}" class="alert alert-danger mt-3" role="alert">
              <span class="mensagem">Erro ao realizar login do usuário!</span>
            </div>

            <div th:if="${param.logout}" class="alert alert-info mt-3" role="alert">
              <span class="mensagem">Logout realizado com sucesso!</span>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Bootstrap 5 JS (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" 
        crossorigin="anonymous"></script>
</body>
</html>
