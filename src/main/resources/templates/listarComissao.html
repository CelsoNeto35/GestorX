<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comissões - GestorX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f6fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #000 0%, #0a0a0a 100%);
            color: #fff;
            position: fixed;
            height: 100vh;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 3px 0 10px rgba(0,0,0,0.3);
        }

        .sidebar .navbar-brand {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .sidebar .nav-link {
            color: #ccc;
            font-weight: 500;
            border-radius: 10px;
            padding: 10px 15px;
            margin: 5px 0;
            transition: all 0.2s ease;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: #fff;
            color: #000;
        }

        .logout-btn {
            background-color: transparent;
            color: #fff;
            border: 1px solid #fc0808;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background-color: #fc0808;
            color: #fff;
        }

        .content {
            margin-left: 250px;
            padding: 40px;
            width: 100%;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .card-header {
            border-radius: 15px 15px 0 0 !important;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card.shadow {
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .table-hover tbody tr:hover {
            background-color: #f5f5f5;
        }

        @media (max-width: 992px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 10px 20px;
            }

            .sidebar ul {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                margin-bottom: 0;
            }

            .sidebar .nav-item { margin: 5px; }
            .content { margin-left: 0; padding: 20px; }
        }

        @media (max-width: 576px) {
            table thead { display: none; }
            table, table tbody, table tr, table td { display: block; width: 100%; }
            table tr { margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; padding: 10px; background-color: #fff; }
            table td { text-align: right; padding-left: 50%; position: relative; font-size: 0.9rem; }
            table td::before { content: attr(data-label); position: absolute; left: 10px; width: 45%; padding-right: 10px; text-align: left; font-weight: bold; color: #000; }
        }
    </style>
</head>

<body>
    <nav class="sidebar">
        <div>
            <a class="navbar-brand" href="/index">GestorX</a>
            <ul class="nav flex-column px-3">
                <li class="nav-item"><a class="nav-link" href="/index">Painel</a></li>
                <li class="nav-item"><a class="nav-link" href="/listarFaturamento">Faturamento</a></li>
                <li class="nav-item"><a class="nav-link active" href="/listarComissao">Comissão</a></li>
                <li class="nav-item"><a class="nav-link" href="/vendaCadastradas">Vendas</a></li>
                <li class="nav-item"><a class="nav-link" href="/produtoCadastrados">Produtos</a></li>
                <li class="nav-item"><a class="nav-link" href="/estoqueCadastrados">Estoque</a></li>
                <li class="nav-item"><a class="nav-link" href="/clienteCadastrados">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/fornecedorCadastrados">Fornecedores</a></li>
                <li class="nav-item"><a class="nav-link" href="/usuarioCadastrados">Usuários</a></li>
            </ul>
        </div>
        <div class="px-3 mb-3">
            <form th:action="@{/logout}" th:method="post">
                <button class="btn logout-btn w-100" type="submit">Sair</button>
            </form>
        </div>
    </nav>

    <div class="content">
        <div class="container">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h5 class="mb-0 fw-bold text-dark">Relatório de Comissões</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Data da Venda</th>
                                    <th>Cliente</th>
                                    <th>Valor Total (R$)</th>
                                    <th>% Comissão</th>
                                    <th>Comissão (R$)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${vendas.isEmpty()}">
                                    <td colspan="6" class="text-center text-muted">Nenhuma venda encontrada.</td>
                                </tr>
                                <tr th:each="venda : ${vendas}">
                                    <td th:text="${venda.id}" data-label="ID"></td>
                                    <td th:text="${#temporals.format(venda.dataVenda, 'dd/MM/yyyy HH:mm')}" data-label="Data da Venda"></td>
                                    <td th:text="${venda.cliente.nomeCompletoRazaoSocial}" data-label="Cliente"></td>
                                    <td th:text="'R$ ' + ${#numbers.formatDecimal(venda.precoTotal, 1, 2)}" data-label="Valor Total"></td>
                                    <td th:text="${#numbers.formatDecimal(venda.comissaoPercentual, 1, 2)} + '%'" data-label="% Comissão"></td>
                                    <td th:text="'R$ ' + ${#numbers.formatDecimal((venda.precoTotal * venda.comissaoPercentual / 100), 1, 2)}"
                                        th:attr="data-total-comissao=${venda.precoTotal * venda.comissaoPercentual / 100}" 
                                        data-label="Comissão (R$)">
                                    </td>
                                </tr>
                            </tbody>
                            <tfoot class="fw-bold text-center">
                                <tr class="table-secondary">
                                    <td colspan="5" class="text-end">Total Geral de Comissões (R$):</td>
                                    <td id="totalComissoes"></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Calcula o total geral de comissões
        document.addEventListener('DOMContentLoaded', function () {
            let total = 0;
            document.querySelectorAll('[data-total-comissao]').forEach(td => {
                const valor = parseFloat(td.getAttribute('data-total-comissao')) || 0;
                total += valor;
            });
            document.getElementById('totalComissoes').textContent = 'R$ ' + total.toLocaleString('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
