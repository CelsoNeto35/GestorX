<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>GestorX - Painel</title>
        <link rel="icon" th:href="@{/assets/icons/favicon.ico}" />

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <!-- Google Charts -->
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

        <style>
            body {
                display: flex;
                min-height: 100vh;
                margin: 0;
                background-color: #f5f6fa;
                font-family: 'Segoe UI', sans-serif;
            }

            /* ===== SIDEBAR ===== */
            .sidebar {
                width: 250px;
                background: linear-gradient(180deg, #000 0%, #0a0a0a 100%);
                color: #fff;
                position: fixed;
                height: 100vh;
                padding-top: 20px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                box-shadow: 3px 0 10px rgba(0, 0, 0, 0.3);
            }

            .sidebar .navbar-brand {
                font-size: 1.6rem;
                font-weight: 700;
                text-align: center;
                color: #fff;
                margin-bottom: 20px;
                letter-spacing: 1px;
            }

            .sidebar .nav-link {
                color: #ccc;
                font-weight: 500;
                border-radius: 10px;
                padding: 10px 15px;
                margin: 5px 0;
                transition: all 0.2s ease;
            }

            .sidebar .nav-link:hover,
            .sidebar .nav-link.active {
                background-color: #fff;
                color: #000;
            }

            .logout-btn {
                background-color: transparent;
                color: #fff;
                border: 1px solid #fc0808;
                transition: 0.3s;
            }

            .logout-btn:hover {
                background-color: #fc0808;
                color: #fff;
            }

            /* ===== MAIN CONTENT ===== */
            .content {
                margin-left: 250px;
                padding: 40px;
                width: 100%;
            }

            .card {
                border: none;
                border-radius: 15px;
            }

            .card-header {
                border-radius: 15px 15px 0 0 !important;
                font-weight: 600;
            }

            .card.shadow {
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            }

            h3.dashboard-title {
                font-weight: 600;
                color: #333;
                margin-bottom: 30px;
            }

            footer {
                text-align: center;
                color: #888;
                margin-top: 30px;
                font-size: 0.9rem;
            }

            /* Loading spinner */
            .spinner-border {
                width: 3rem;
                height: 3rem;
                border-width: 0.3em;
            }
        </style>
    </head>

    <body>
        <!-- ===== SIDEBAR ===== -->
        <nav class="sidebar">
            <div>
                <a class="navbar-brand" href="/index">GestorX</a>
                <ul class="nav flex-column px-3">
                    <li class="nav-item"><a class="nav-link active" href="/index">Painel</a></li>
                    <li class="nav-item"><a class="nav-link" href="/listarFaturamento">Faturamento</a></li>
                    <li class="nav-item"><a class="nav-link" href="/listarComissao">Comissão</a></li>
                    <li class="nav-item"><a class="nav-link" href="/vendaCadastradas">Vendas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/produtoCadastrados">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/estoqueCadastrados">Estoque</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clienteCadastrados">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/fornecedorCadastrados">Fornecedores</a></li>
                    <li class="nav-item"><a class="nav-link" href="/usuarioCadastrados">Usuários</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="dropdownRelatorios" 
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Relatórios
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="dropdownRelatorios">
                            <li>
                                <a class="dropdown-item" href="/relatorio/vendas/pdf" target="_blank">
                                    Relatório de Vendas
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>

            <form th:action="@{/logout}" method="post" class="px-3 mb-3">
                <button class="btn logout-btn w-100" type="submit">Sair</button>
            </form>
        </nav>

        <!-- ===== MAIN CONTENT ===== -->
        <div class="content">
            <h3 class="dashboard-title">Dashboard</h3>

            <div class="row g-4">
                <!-- Gráfico Coluna -->
                <div class="col-12">
                    <h5 class="mb-2 text-dark fw-bold">Vendas Mensais</h5>
                    <div id="column_chart" style="width: 100%; height: 400px;"></div>
                </div>

                <!-- Gráfico Pizza -->
                <div class="col-md-6">
                    <h5 class="mb-2 text-dark fw-bold">Raças</h5>
                    <div id="pie_chart" style="width: 100%; height: 400px;"></div>
                </div>

                <!-- Gráfico Donut -->
                <div class="col-md-6">
                    <h5 class="mb-2 text-dark fw-bold">Produtos</h5>
                    <div id="donut_chart" style="width: 100%; height: 400px;"></div>
                </div>
            </div>

            <footer>
                © 2025 GestorX - Todos os direitos reservados
            </footer>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- ===== SCRIPTS GOOGLE CHARTS COM DADOS REAIS ===== -->
        <script th:inline="none">
            google.charts.load('current', {'packages': ['corechart']});
            google.charts.setOnLoadCallback(drawCharts);

            async function drawCharts() {
                try {
                    // Mostrar loading nos gráficos
                    document.getElementById('column_chart').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Carregando dados...</p></div>';
                    document.getElementById('pie_chart').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div></div>';
                    document.getElementById('donut_chart').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div></div>';

                    // Buscar dados reais do backend
                    const [vendasResponse, racasResponse, produtosResponse] = await Promise.all([
                        fetch('/index/api/vendas-mensais'),
                        fetch('/index/api/racas'),
                        fetch('/index/api/produtos')
                    ]);

                    // Verificar se as requisições foram bem-sucedidas
                    if (!vendasResponse.ok || !racasResponse.ok || !produtosResponse.ok) {
                        throw new Error('Erro ao buscar dados do servidor');
                    }

                    const vendas = await vendasResponse.json();
                    const racas = await racasResponse.json();
                    const produtos = await produtosResponse.json();

                    // ===== GRÁFICO DE VENDAS MENSAIS (Colunas) =====
                    const columnDataArray = [["Mês", "Vendas", {role: "style"}]];
                    
                    if (Object.keys(vendas).length === 0) {
                        columnDataArray.push(["Sem dados", 0, "color: #cccccc"]);
                    } else {
                        Object.entries(vendas).forEach(([mes, valor], index) => {
                            columnDataArray.push([
                                mes, 
                                valor, 
                                index % 2 === 0 ? "color: #000000" : "color: #1E88E5"
                            ]);
                        });
                    }
                    
                    const columnData = google.visualization.arrayToDataTable(columnDataArray);

                    const columnOptions = {
                        title: "Vendas por Mês",
                        legend: {position: "none"},
                        backgroundColor: "transparent",
                        hAxis: {
                            title: "Mês",
                            titleTextStyle: {color: '#333'}
                        },
                        vAxis: {
                            title: "Quantidade de Vendas",
                            minValue: 0,
                            format: '0'
                        },
                        chartArea: {width: '85%', height: '70%'}
                    };

                    // ===== GRÁFICO DE RAÇAS (Pizza) =====
                    const pieDataArray = [["Categoria", "Quantidade"]];
                    
                    if (Object.keys(racas).length === 0) {
                        pieDataArray.push(["Sem dados", 1]);
                    } else {
                        Object.entries(racas).forEach(([categoria, quantidade]) => {
                            pieDataArray.push([categoria, quantidade]);
                        });
                    }
                    
                    const pieData = google.visualization.arrayToDataTable(pieDataArray);

                    const pieOptions = {
                        pieSliceText: "value",
                        legend: {position: "right"},
                        backgroundColor: "transparent",
                        colors: ["#000000", "#1E88E5", "#43A047", "#FB8C00", "#E53935"],
                        chartArea: {width: '90%', height: '80%'}
                    };

                    // ===== GRÁFICO DE PRODUTOS (Donut) =====
                    const donutDataArray = [["Categoria", "Quantidade"]];
                    
                    if (Object.keys(produtos).length === 0) {
                        donutDataArray.push(["Sem dados", 1]);
                    } else {
                        Object.entries(produtos).forEach(([categoria, quantidade]) => {
                            donutDataArray.push([categoria, quantidade]);
                        });
                    }
                    
                    const donutData = google.visualization.arrayToDataTable(donutDataArray);

                    const donutOptions = {
                        pieHole: 0.5,
                        legend: {position: "right"},
                        backgroundColor: "transparent",
                        colors: ["#000000", "#1E88E5", "#43A047", "#FB8C00", "#E53935"],
                        chartArea: {width: '90%', height: '80%'},
                        pieSliceText: "value"
                    };

                    // Renderizar todos os gráficos
                    new google.visualization.ColumnChart(document.getElementById('column_chart')).draw(columnData, columnOptions);
                    new google.visualization.PieChart(document.getElementById('pie_chart')).draw(pieData, pieOptions);
                    new google.visualization.PieChart(document.getElementById('donut_chart')).draw(donutData, donutOptions);

                    // Log de sucesso (pode remover em produção)
                    console.log('✅ Gráficos carregados com sucesso!');
                    console.log('📊 Vendas:', vendas);
                    console.log('📊 Raças:', racas);
                    console.log('📊 Produtos:', produtos);

                } catch (error) {
                    console.error('❌ Erro ao carregar dados dos gráficos:', error);
                    
                    // Mostrar mensagem de erro amigável
                    const errorMessage = `
                        <div class="alert alert-danger m-3" role="alert">
                            <strong>Erro ao carregar dados!</strong><br>
                            Por favor, recarregue a página ou entre em contato com o suporte.
                        </div>
                    `;
                    
                    document.getElementById('column_chart').innerHTML = errorMessage;
                    document.getElementById('pie_chart').innerHTML = errorMessage;
                    document.getElementById('donut_chart').innerHTML = errorMessage;
                }
            }

            // Opcional: Atualizar gráficos automaticamente a cada 5 minutos
            // setInterval(drawCharts, 300000);
        </script>

        <!-- SweetAlert Boas-vindas -->
        <script th:if="${loginSucesso}">
            document.addEventListener("DOMContentLoaded", function () {
                Swal.fire({
                    title: 'Bem-vindo ao GestorX!',
                    text: 'Login realizado com sucesso.',
                    icon: 'success',
                    showConfirmButton: false,
                    timer: 2200,
                    timerProgressBar: true,
                    position: 'center'
                });
            });
        </script>
    </body>
</html>
